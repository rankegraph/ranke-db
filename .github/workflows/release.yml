name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Built once, not once per Go build leg: every leg embeds the same explorer.html.
  # -tags explorer is release-only — a plain `go build` (dev, tests) needs neither
  # Node nor the file (-> frontend/embed.go).
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build dist/explorer.html
        run: make -C frontend single

      - uses: actions/upload-artifact@v4
        with:
          name: explorer-html
          path: frontend/dist/explorer.html
          retention-days: 1

  # Built once, alongside the binaries: the handbook and the chapter sources join
  # them in the same directory the release job publishes whole, so no second glob
  # is needed there.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One pin, kept in the Makefile, so bumping it there moves this install too.
      - name: Read the typst pin
        id: pin
        run: echo "version=$(make -s print-typst-version)" >> "$GITHUB_OUTPUT"

      - name: Install Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: ${{ steps.pin.outputs.version }}

      - name: Build dist/docs.pdf
        run: make docs-pdf DOCS_VERSION=${{ github.ref_name }}

      # The chapters and the two contracts, so a website or a client generator
      # takes one asset per repository rather than cloning each of them.
      - name: Pack the docs bundle
        run: make docs-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: |
            dist/docs.pdf
            dist/ranke-db-docs.tar.gz
            dist/TYPST_VERSION
          retention-days: 1

  build:
    needs: frontend
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: explorer-html
          path: frontend/dist

      # Static (CGO_ENABLED=0): neither binary has a cgo dependency, and a static
      # binary is what a downloader can run without matching the build host's libc.
      #
      # Both halves ship: ranke-db operates an instance from its config, ranke-client
      # holds a contributor key and addresses one already running. Only the server
      # takes -tags explorer, the client embedding no UI.
      #
      # The version is stamped from the tag rather than left to the toolchain's own
      # VCS stamping, so what /health and `ranke-db` at / report is the release name
      # and not a pseudo-version derived from a shallow checkout.
      - name: Build the binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          suffix="${{ matrix.goos }}-${{ matrix.goarch }}"
          ldflags="-X github.com/rankegraph/ranke-db/internal/version.injected=${{ github.ref_name }}"
          mkdir -p dist
          go build -tags explorer -ldflags "$ldflags" -o "dist/ranke-db-$suffix" ./cmd/ranke-db
          go build -ldflags "$ldflags" -o "dist/ranke-client-$suffix" ./cmd/ranke-client

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  release:
    needs: [build, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A tag carrying a hyphen is a release candidate (`make release pre`), and
      # says so: unmarked it would take the repo's "latest release", which is
      # what a downloader's `/releases/latest` resolves to.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
